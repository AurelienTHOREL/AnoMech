name: Sample PR Builder for AnoMech

on:
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: windows-2022

    env:
      Solution_Name: AnoMech

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Build with dotnet
      run: dotnet build --configuration Release

    - name: Build relay
      run: dotnet build Relay/AnoMech.Relay/AnoMech.Relay.csproj --configuration Release

    - name: Security regression checks
      run: |
        dotnet run --project tests/SecurityTests/SecurityTests.csproj --configuration Release
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python -m unittest discover -s tests -p test_replay_export.py -v

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AnoMech
        path: .\AnoMech\bin\x64\Release\AnoMech\*
        if-no-files-found: error
        retention-days: 1

